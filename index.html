<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>CV Interactivo</title>
  <meta name="description" content="CV interactivo y portafolio profesional.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23d6001c'/%3E%3Ctext x='50' y='70' font-size='60' font-weight='700' text-anchor='middle' fill='white' font-family='Arial,sans-serif'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Aplica el tema guardado antes del primer pintado (evita el parpadeo). -->
  <script src="js/tema_inicial.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>

<a class="enlace_salto" href="#contenido_principal" data-texto="textos.saltar_contenido"></a>

 <!-- ===================== CABECERA Y NAVEGACIÓN ===================== -->
  <header class="cabecera_sitio" id="inicio_pagina">
    <a class="marca" href="#inicio">
      <span class="marca_sigla" id="marca_sigla"></span>
      <span class="marca_nombre" id="marca_nombre"></span>
    </a>

    <button class="boton_menu" id="boton_menu" type="button"
            aria-expanded="false" aria-controls="navegacion_principal"
            data-attr="aria-label:textos.menu_etiqueta">
      <span class="hamburguesa" aria-hidden="true"></span>
    </button>

    <nav class="navegacion" id="navegacion_principal"
         data-attr="aria-label:textos.navegacion_etiqueta">
      <ul id="lista_navegacion" role="list"></ul>
    </nav>

    <button class="boton_tema" id="boton_tema" type="button" aria-pressed="false">
      <span id="icono_tema" aria-hidden="true"></span>
      <span class="boton_tema_texto" data-texto="textos.tema.boton"></span>
    </button>
  </header>

  <main id="contenido_principal">

    <p class="aviso_global" id="aviso_global" role="alert" hidden></p>

  <!-- ===================== PRESENTACIÓN ===================== -->
    <section class="hero" id="inicio" aria-labelledby="titulo_hero">
      <hgroup class="hero_titulos">
        <p class="etiqueta_superior" data-texto="persona.etiqueta_superior"></p>
        <h1 id="titulo_hero" data-texto="persona.nombre"></h1>
        <p class="hero_rol" data-texto="persona.rol"></p>
      </hgroup>

      <ul class="hero_acciones" id="lista_acciones" role="list"
          data-attr="aria-label:textos.acciones_etiqueta"></ul>

      <address class="hero_contacto" data-attr="aria-label:textos.contacto_etiqueta">
        <dl id="datos_hero"></dl>
      </address>

      <figure class="hero_foto">
        <img alt="" data-attr="src:persona.foto.src;alt:persona.foto.alt">
        <figcaption data-texto="persona.foto.pie"></figcaption>
      </figure>

      <aside class="hero_lateral" data-attr="aria-label:textos.hero_lateral_etiqueta">
        <blockquote>
          <p data-texto="persona.frase"></p>
        </blockquote>
        <ul class="estadisticas" id="lista_estadisticas" role="list"
            data-attr="aria-label:textos.estadisticas.etiqueta"></ul>
      </aside>
    </section>

    <aside class="marquesina" aria-hidden="true">
      <ul id="lista_marquesina"></ul>
    </aside>

  <!-- ===================== PERFIL PROFESIONAL ===================== -->
    <section id="perfil" aria-labelledby="titulo_perfil">
      <h2 id="titulo_perfil" data-texto="secciones.perfil.titulo"></h2>

      <article class="perfil_texto" id="perfil_parrafos"></article>

      <article class="perfil_panel">
        <h3 data-texto="secciones.perfil.fortalezas"></h3>
        <ul class="chips" id="lista_fortalezas" role="list"></ul>

        <h3 data-texto="secciones.perfil.objetivo"></h3>
        <p id="perfil_objetivo"></p>
      </article>
    </section>

 <!-- ===================== FORMACIÓN ACADÉMICA ===================== -->
    <section id="formacion" aria-labelledby="titulo_formacion">
      <h2 id="titulo_formacion" data-texto="secciones.formacion.titulo"></h2>
      <ol class="linea_tiempo" id="lista_formacion" role="list"></ol>
    </section>


  <!-- ===================== EXPERIENCIA ===================== -->
    <section id="experiencia" aria-labelledby="titulo_experiencia">
      <h2 id="titulo_experiencia" data-texto="secciones.experiencia.titulo"></h2>
      <p class="nota_seccion" data-texto="secciones.experiencia.nota"></p>
      <ol class="linea_tiempo" id="lista_experiencia" role="list"></ol>
    </section>

 <!-- ===================== BUSCADOR DEL PORTAFOLIO ===================== -->
    <section id="explorar" aria-labelledby="titulo_explorar">
      <h2 id="titulo_explorar" data-texto="secciones.explorar.titulo"></h2>

      <form class="buscador" id="form_buscador" role="search" novalidate>
        <label for="campo_busqueda" data-texto="secciones.explorar.etiqueta"></label>
        <input type="search" id="campo_busqueda" name="q" autocomplete="off"
               aria-describedby="estado_busqueda"
               data-attr="placeholder:secciones.explorar.placeholder">
        <button class="boton boton_secundario" id="boton_limpiar_busqueda" type="button"
                data-texto="secciones.explorar.limpiar"></button>
      </form>

      <p class="estado_busqueda" id="estado_busqueda" role="status" aria-live="polite"></p>
    </section>

  <!-- ===================== PROYECTOS DESTACADOS ===================== -->
    <section id="proyectos" aria-labelledby="titulo_proyectos">
      <h2 id="titulo_proyectos" data-texto="secciones.proyectos.titulo"></h2>
      <ul class="rejilla rejilla_proyectos" id="lista_proyectos" role="list"></ul>
      <p class="mensaje_vacio" id="vacio_proyectos" data-texto="secciones.proyectos.vacio" hidden></p>
    </section>

   <!-- ===================== HABILIDADES TÉCNICAS ===================== -->
    <section id="habilidades" aria-labelledby="titulo_habilidades">
      <h2 id="titulo_habilidades" data-texto="secciones.habilidades.titulo"></h2>
      <ul class="rejilla rejilla_habilidades" id="lista_habilidades" role="list"></ul>
      <p class="mensaje_vacio" id="vacio_habilidades" data-texto="secciones.habilidades.vacio" hidden></p>
    </section>

  <!-- ===================== CERTIFICACIONES ===================== -->
    <section id="certificaciones" aria-labelledby="titulo_certificaciones">
      <h2 id="titulo_certificaciones" data-texto="secciones.certificaciones.titulo"></h2>
      <ul class="rejilla rejilla_certificaciones" id="lista_certificaciones" role="list"></ul>
      <p class="mensaje_vacio" id="vacio_certificaciones" data-texto="secciones.certificaciones.vacio" hidden></p>
    </section>

  <!-- ===================== IDIOMAS ===================== -->
    <section id="idiomas" aria-labelledby="titulo_idiomas">
      <h2 id="titulo_idiomas" data-texto="secciones.idiomas.titulo"></h2>

      <figure class="tabla_envoltorio" role="region" tabindex="0"
              data-attr="aria-label:secciones.idiomas.region_etiqueta">
        <table class="tabla_idiomas">
          <caption data-texto="secciones.idiomas.caption"></caption>
          <thead>
            <tr id="cabecera_idiomas"></tr>
          </thead>
          <tbody id="cuerpo_idiomas"></tbody>
        </table>
      </figure>
    </section>

   <!-- ===================== MULTIMEDIA ===================== -->
    <section id="multimedia" aria-labelledby="titulo_multimedia">
      <h2 id="titulo_multimedia" data-texto="secciones.multimedia.titulo"></h2>

      <ul class="rejilla rejilla_multimedia" role="list">
        <li>
          <figure class="medio">
            <img alt="" loading="lazy" data-attr="src:multimedia.imagen.src;alt:multimedia.imagen.alt">
            <figcaption data-texto="multimedia.imagen.pie"></figcaption>
          </figure>
        </li>
        <li>
          <figure class="medio">
            <audio id="reproductor_audio" controls preload="none"></audio>
            <figcaption data-texto="multimedia.audio.titulo"></figcaption>
          </figure>
        </li>
        <li>
          <figure class="medio medio_video">
            <video id="reproductor_video" controls preload="metadata"></video>
            <figcaption data-texto="multimedia.video.titulo"></figcaption>
          </figure>
        </li>
      </ul>
    </section>

<!-- ===================== API REST con Fetch ===================== -->
    <section id="github" aria-labelledby="titulo_github" aria-busy="true" data-estado="cargando">
      <h2 id="titulo_github" data-texto="secciones.github.titulo"></h2>
      <p class="nota_seccion" data-texto="secciones.github.intro"></p>

      <article class="perfil_github" id="perfil_github" hidden></article>

      <p class="estado_github" id="estado_github" role="status" aria-live="polite"></p>
      <button class="boton boton_secundario" id="boton_reintentar" type="button"
              data-texto="secciones.github.reintentar" hidden></button>

      <ul class="rejilla rejilla_repos" id="lista_repos" role="list"></ul>
    </section>

<!-- ===================== CONTACTO ===================== -->
    <section class="contacto" id="contacto" aria-labelledby="titulo_contacto">
      <h2 id="titulo_contacto" data-texto="secciones.contacto.titulo"></h2>
      <p class="nota_seccion" data-texto="secciones.contacto.intro"></p>

      <form class="formulario" id="form_contacto" novalidate>
        <fieldset>
          <legend data-texto="formulario.legend"></legend>

          <p class="campo">
            <label for="nombre" data-texto="formulario.campos.nombre.etiqueta"></label>
            <input type="text" id="nombre" name="nombre" data-campo
                   minlength="3" maxlength="80" required autocomplete="name"
                   aria-describedby="error_nombre"
                   data-attr="placeholder:formulario.campos.nombre.placeholder">
            <span class="campo_mensaje" id="error_nombre"></span>
          </p>

          <p class="campo">
            <label for="correo" data-texto="formulario.campos.correo.etiqueta"></label>
            <input type="email" id="correo" name="correo" data-campo
                   required autocomplete="email"
                   aria-describedby="error_correo"
                   data-attr="placeholder:formulario.campos.correo.placeholder">
            <span class="campo_mensaje" id="error_correo"></span>
          </p>

          <p class="campo">
            <label for="telefono" data-texto="formulario.campos.telefono.etiqueta"></label>
            <input type="tel" id="telefono" name="telefono" data-campo
                   pattern="\+?[0-9]{7,15}" autocomplete="tel"
                   aria-describedby="error_telefono"
                   data-attr="placeholder:formulario.campos.telefono.placeholder">
            <span class="campo_mensaje" id="error_telefono"></span>
          </p>

          <p class="campo">
            <label for="motivo" data-texto="formulario.campos.motivo.etiqueta"></label>
            <select id="motivo" name="motivo" data-campo required aria-describedby="error_motivo"></select>
            <span class="campo_mensaje" id="error_motivo"></span>
          </p>

          <p class="campo">
            <label for="mensaje" data-texto="formulario.campos.mensaje.etiqueta"></label>
            <textarea id="mensaje" name="mensaje" data-campo rows="5"
                      minlength="10" maxlength="500" required
                      aria-describedby="error_mensaje contador_mensaje"
                      data-attr="placeholder:formulario.campos.mensaje.placeholder"></textarea>
            <span class="campo_mensaje" id="error_mensaje"></span>
            <span class="campo_contador" id="contador_mensaje"></span>
          </p>

          <p class="campo campo_casilla">
            <input type="checkbox" id="aceptacion" name="aceptacion" data-campo
                   value="si" required aria-describedby="error_aceptacion">
            <label for="aceptacion" data-texto="formulario.campos.aceptacion.etiqueta"></label>
            <span class="campo_mensaje" id="error_aceptacion"></span>
          </p>
        </fieldset>

        <p class="acciones_formulario">
          <button class="boton boton_primario" type="submit" data-texto="formulario.botones.enviar"></button>
          <button class="boton boton_secundario" type="reset" data-texto="formulario.botones.limpiar"></button>
        </p>

        <p class="estado_formulario" id="estado_formulario" role="status" aria-live="polite"></p>
      </form>

      <aside class="contacto_lateral" data-attr="aria-label:secciones.contacto.datos_titulo">
        <h3 data-texto="secciones.contacto.datos_titulo"></h3>
        <address>
          <dl id="datos_contacto"></dl>
        </address>

        <h3 data-texto="secciones.contacto.enlaces_titulo"></h3>
        <ul class="enlaces_profesionales" id="lista_enlaces" role="list"></ul>
      </aside>
    </section>

</main>

<!-- ===================== PIE DE PÁGINA ===================== -->
  <footer class="pie_sitio">
    <p data-texto="textos.pie.linea_principal"></p>
    <address>
      <dl id="datos_pie"></dl>
    </address>
    <p><small data-texto="textos.pie.tecnologias"></small></p>
    <p><a href="#inicio_pagina" data-texto="textos.pie.volver_arriba"></a></p>
  </footer>

</body>
</html>
